# Install as /etc/nginx/sites-available/cattfan.site after issuing the
# cattfan.site/www.cattfan.site certificate with the existing ACME webroot.
server {
  server_tokens off;
  listen 80;
  listen [::]:80;
  server_name cattfan.site www.cattfan.site;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://cattfan.site$request_uri;
  }
}

server {
  server_tokens off;
  listen 192.168.2.5:443 ssl;
  server_name www.cattfan.site;

  ssl_certificate /etc/letsencrypt/live/cattfan.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cattfan.site/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://cattfan.site$request_uri;
}

server {
  server_tokens off;
  listen 192.168.2.5:443 ssl;
  server_name cattfan.site;
  client_max_body_size 1k;

  ssl_certificate /etc/letsencrypt/live/cattfan.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cattfan.site/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:18088;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_pass_header Content-Encoding;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
