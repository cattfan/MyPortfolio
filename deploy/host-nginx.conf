# Install as /etc/nginx/sites-available/cattfan.site after checking the host config.
# Name-specific routing preserves other existing virtual hosts and the default server.
server {
  server_tokens off;
  listen 80;
  listen [::]:80;
  server_name cattfan.site www.cattfan.site 113.161.254.76;
  client_max_body_size 1k;
  location / {
    proxy_pass http://127.0.0.1:18088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
