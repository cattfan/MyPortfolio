worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json application/geo+json image/svg+xml;
  map $uri $cache_control {
    default "no-cache";
    ~^/_next/static/ "public, max-age=31536000, immutable";
    ~\.(webp|woff|woff2|ttf|geojson)$ "public, max-age=86400";
  }
  server {
    listen 8080;
    server_name cattfan.site www.cattfan.site _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = / { try_files /index.html =404; }
    location = /50x.html { return 404; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { return 404; }
    location ~* \.(map|env|log|ya?ml|sh|ts|tsx|py)$ { return 404; }
    location / { try_files $uri $uri.html =404; }
    error_page 404 /404.html;
  }
}
